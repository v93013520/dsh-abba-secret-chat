<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f4f6fb">
<title>密码碰头 · 端到端加密双人聊天</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --line:#e6eaf2; --text:#1b2333; --dim:#6b7590;
  --accent:#4f7cff; --accent2:#7a5cff; --danger:#e5484d; --soft:#eef3ff;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;
  padding:40px 16px;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  background:
    radial-gradient(560px 420px at 10% -6%, rgba(79,124,255,.16), transparent 60%),
    radial-gradient(640px 480px at 106% 14%, rgba(255,94,150,.13), transparent 62%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
.app{width:100%;max-width:620px;position:relative}
header{text-align:center;margin-bottom:24px}
.logo{display:flex;justify-content:center;margin-bottom:10px}
h1{font-size:27px;margin:0 0 8px;letter-spacing:1px}
.sub{color:var(--dim);margin:0;font-size:14px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px;
  box-shadow:0 14px 44px rgba(27,35,51,.08);
}
.hidden{display:none!important}
.field-head{display:flex;align-items:center;gap:9px;margin-bottom:8px}
.field + .field{margin-top:16px}
.badge{
  width:26px;height:26px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;flex:none;
}
.badge-a{background:var(--soft);color:var(--accent);border:1px solid #dbe6ff}
.badge-b{background:#fff0f5;color:#e05a8a;border:1px solid #ffd9e6}
label{font-size:13.5px;color:var(--dim);font-weight:600}
input[type=password],input[type=text]{
  width:100%;background:#f8f9fd;border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px 15px;font-size:15px;outline:none;
  transition:border-color .15s, box-shadow .15s;
}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,124,255,.14)}
button{
  cursor:pointer;border:none;border-radius:12px;font-size:15px;padding:12px 18px;
  font-family:inherit;transition:filter .15s, transform .05s, background .15s;
}
button:active{transform:translateY(1px)}
#btn-start{
  width:100%;margin-top:20px;padding:14px;color:#fff;font-weight:700;font-size:16px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 22px rgba(79,124,255,.32);
}
#btn-start:hover{filter:brightness(1.06)}
#btn-start:disabled{opacity:.55;cursor:default}
.err{color:var(--danger);font-size:13px;min-height:18px;margin:10px 0 0}
.rules{
  border-top:1px dashed var(--line);margin:18px 0 0;padding:16px 0 0;
  color:var(--dim);font-size:13.5px;line-height:2.05;
}
.rules p{margin:0;display:flex;gap:8px}
.rules .n{
  flex:none;width:18px;height:18px;margin-top:5px;border-radius:50%;background:var(--soft);
  color:var(--accent);font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;
}
.notice{color:#12855f;font-size:13px;margin:12px 0 0}
/* 等待页 */
#screen-wait{text-align:center;padding:40px 24px}
.pulse{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:20px}
.p-a,.p-b{
  width:52px;height:52px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:800;font-size:20px;
}
.p-a{background:var(--soft);color:var(--accent);border:1px solid #dbe6ff}
.p-b{background:#fff0f5;color:#e05a8a;border:1px solid #ffd9e6}
.p-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:meet 1.3s ease-in-out infinite}
@keyframes meet{0%,100%{transform:translateX(-30px);opacity:.35}50%{transform:translateX(30px);opacity:1}}
.wait-title{font-size:16.5px;font-weight:700;margin:0 0 10px}
.dim{color:var(--dim);font-size:13.5px;line-height:1.9;margin:0}
.row{display:flex;gap:10px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.ghost{background:#fff;border:1px solid var(--line);color:var(--dim)}
.ghost:hover{color:var(--text);border-color:#c9d2e4}
.ghost.warm{color:var(--danger);border-color:#f3c8ca}
.ghost.warm:hover{background:#fdf2f2;border-color:#ecb9bc}
/* 聊天页 */
#screen-chat{padding:0;overflow:hidden}
#screen-chat.dragover{box-shadow:0 0 0 3px rgba(79,124,255,.28),0 14px 44px rgba(27,35,51,.08)}
#screen-chat.dragover #msgs{background:#f2f6ff}
.chat-head{display:flex;align-items:center;gap:9px;padding:15px 18px;border-bottom:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:#22b573;box-shadow:0 0 0 4px rgba(34,181,115,.16);flex:none;animation:breath 2.2s ease-in-out infinite}
@keyframes breath{0%,100%{box-shadow:0 0 0 3px rgba(34,181,115,.14)}50%{box-shadow:0 0 0 6px rgba(34,181,115,.05)}}
.chat-head .st{font-size:13.5px;color:var(--dim);flex:1}
.danger{background:#fff;border:1px solid #f3c8ca;color:var(--danger);font-size:13px;padding:7px 13px;font-weight:600;flex:none}
.danger:hover{background:#fdf2f2}
#msgs{height:400px;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:8px;background:#fbfcff}
.msg{max-width:78%;padding:9px 13px;border-radius:15px;font-size:14.5px;line-height:1.55;word-break:break-word;display:flex;flex-direction:column;gap:3px}
.msg .tag{font-size:10.5px;font-weight:700;letter-spacing:.6px;line-height:1;opacity:.8;flex:none}
.msg .body{white-space:pre-wrap;word-break:break-word;display:block}
.msg.self{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:5px}
.msg.self .tag{color:rgba(255,255,255,.82)}
.msg.peer{align-self:flex-start;background:#f1f4fa;border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.peer .tag{color:#8b96b0}
.msg.sys{align-self:center;background:none;color:var(--dim);font-size:12.5px;padding:2px;max-width:95%;text-align:center;display:block}
.msg .pic{display:block;max-width:100%;max-height:280px;width:auto;height:auto;border-radius:10px;cursor:zoom-in;background:#fff}
.msg.pic-msg{padding:8px}
.msg.pic-msg .tag{padding:3px 1px 0}
.msg.self .pic{box-shadow:0 3px 12px rgba(27,35,51,.14)}
/* 待发送图片预览 */
#preview{border-top:1px solid var(--line);background:#f7f9ff;padding:12px 14px}
.preview-body{display:flex;gap:12px;align-items:center}
#preview-img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:#fff;flex:none}
.preview-side{flex:1;min-width:0}
.preview-meta{display:block;font-size:12px;color:var(--dim);margin-bottom:8px;line-height:1.6}
.preview-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#btn-preview-send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px}
#btn-preview-send:hover{filter:brightness(1.06)}
#btn-preview-cancel{background:#fff;border:1px solid var(--line);color:var(--dim);font-size:13px;padding:8px 12px;border-radius:10px}
/* 输入区 */
#send-form{display:flex;gap:8px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
#send-form input[type=text]{flex:1;min-width:120px;background:#fff;padding:10px 13px;font-size:14.5px;border-radius:11px}
.tool{background:#f2f5fb;border:1px solid var(--line);color:var(--dim);font-size:13px;padding:9px 11px;border-radius:10px;font-weight:600;flex:none}
.tool:hover{color:var(--text);border-color:#c9d2e4;background:#eef2fa}
#send-form button[type=submit]{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:700;padding:10px 18px;border-radius:11px;font-size:14.5px;flex:none}
#send-form button[type=submit]:hover{filter:brightness(1.06)}
/* 图片放大层 */
.img-view{position:fixed;inset:0;z-index:60;background:rgba(15,21,36,.78);display:flex;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
.img-view img{max-width:92vw;max-height:88vh;border-radius:14px;background:#fff;box-shadow:0 20px 70px rgba(0,0,0,.45);cursor:default}
#img-view-close{position:fixed;top:18px;right:18px;background:rgba(255,255,255,.92);color:var(--text);font-size:13px;font-weight:700;padding:8px 14px;border-radius:10px;cursor:pointer}
footer{text-align:center;color:#9aa3ba;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="54" height="54" viewBox="0 0 54 54">
        <rect x="3" y="9" width="30" height="30" rx="9" fill="#4f7cff" opacity="0.92"/>
        <rect x="21" y="15" width="30" height="30" rx="9" fill="#ff5e96" opacity="0.85"/>
        <text x="12.5" y="29" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="inherit">A</text>
        <text x="42" y="36" font-size="13" font-weight="700" fill="#fff" text-anchor="middle" font-family="inherit">B</text>
      </svg>
    </div>
    <h1>密码碰头</h1>
    <p class="sub">两个密码都填对，才能碰上头 · 端到端加密 · 聊完即焚</p>
  </header>

  <!-- 开始页 -->
  <section id="screen-start" class="card">
    <div class="field">
      <div class="field-head"><span class="badge badge-a">A</span><label for="pwd-a">A 的密码</label></div>
      <input id="pwd-a" type="password" placeholder="A 约定的密码（至少 4 位）" autocomplete="off" spellcheck="false" maxlength="128">
    </div>
    <div class="field">
      <div class="field-head"><span class="badge badge-b">B</span><label for="pwd-b">B 的密码</label></div>
      <input id="pwd-b" type="password" placeholder="B 约定的密码（至少 4 位）" autocomplete="off" spellcheck="false" maxlength="128">
    </div>
    <button id="btn-start">开始碰头</button>
    <p id="start-err" class="err"></p>
    <div class="rules">
      <p><span class="n">1</span><span>A、B 各定一个密码，互相告诉对方</span></p>
      <p><span class="n">2</span><span>双方都填：A 框填 A 的密码，B 框填 B 的密码（填反也认得）</span></p>
      <p><span class="n">3</span><span>消息端到端加密后只经服务器转发，服务器看不到内容</span></p>
      <p><span class="n">4</span><span>任何一方退出，聊天立刻消失，什么也不留下</span></p>
    </div>
    <p id="last-end" class="notice"></p>
  </section>

  <!-- 等待页 -->
  <section id="screen-wait" class="card hidden">
    <div class="pulse" aria-hidden="true"><span class="p-a">A</span><span class="p-dot"></span><span class="p-b">B</span></div>
    <p class="wait-title">已就位，等对方来碰头…</p>
    <p class="dim">保持本页开着，把 A、B 两个密码和本页地址告诉对方。<br>10 分钟没人来会自动取消。</p>
    <div class="row">
      <button id="btn-copy" class="ghost">复制本页链接</button>
      <button id="btn-cancel" class="ghost warm">取消等待</button>
    </div>
  </section>

  <!-- 聊天页：不显示任何名字，只有「我 / 你」标签 -->
  <section id="screen-chat" class="card hidden">
    <div class="chat-head">
      <span class="dot"></span>
      <span class="st">碰头成功 · 端到端加密 · 聊天不会留下任何记录</span>
      <button id="btn-leave" class="danger">结束聊天</button>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <div id="preview" class="hidden">
      <div class="preview-body">
        <img id="preview-img" alt="待发送的图片预览">
        <div class="preview-side">
          <span id="preview-meta" class="preview-meta"></span>
          <div class="preview-actions">
            <button id="btn-preview-send" type="button">发送图片</button>
            <button id="btn-preview-cancel" type="button" class="ghost">取消</button>
          </div>
        </div>
      </div>
    </div>
    <form id="send-form">
      <input id="file-input" type="file" accept="image/*" class="hidden" tabindex="-1" aria-hidden="true">
      <button id="btn-image" type="button" class="tool" title="发送图片（也可粘贴或拖入）">图片</button>
      <button id="btn-shot" type="button" class="tool" title="截屏并发送当前屏幕">截屏</button>
      <input id="text" type="text" maxlength="2000" placeholder="说点什么… 回车即发送" autocomplete="off" enterkeyhint="send">
      <button type="submit">发送</button>
    </form>
  </section>

  <footer>端到端加密 · 消息只在内存中转发 · 不保存任何记录 · 退出即消失</footer>
</div>

<!-- 图片放大查看层 -->
<div id="img-view" class="img-view hidden" role="dialog" aria-modal="true" aria-label="查看图片">
  <img id="img-view-img" alt="图片">
  <button id="img-view-close" type="button">关闭 ✕</button>
</div>

<script src="/vendor/crypto-js.js" onerror="window.__abbaVendorLoadError=true"></script>
<script src="/crypto.js" onerror="window.__abbaCryptoLoadError=true"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  var MAX_TEXT_LEN = 2000;
  var MAX_IMAGE_BYTES = 600 * 1024;
  var MAX_IMAGE_EDGE = 1600;
  var JPEG_QUALITY = 0.82;
  var MAX_PAYLOAD_LEN = Math.floor(2.5 * 1024 * 1024);
  var TAG_SELF = '我';
  var TAG_PEER = '你';

  // 每个页面实例一个随机客户端标识（只存在内存，不落任何存储）
  function rnd() {
    if (window.crypto && crypto.getRandomValues) {
      var b = new Uint8Array(16);
      crypto.getRandomValues(b);
      return Array.prototype.map.call(b, function (x) { return x.toString(16).padStart(2, '0'); }).join('');
    }
    var s = '';
    for (var i = 0; i < 32; i++) s += Math.floor(Math.random() * 16).toString(16);
    return s;
  }
  var cid = rnd();

  var state = 'idle';      // idle | waiting | chat
  var roomId = null;
  var encKey = null;
  var macKey = null;
  var pairKey = null;
  var es = null;
  var esDownNotified = false;
  var esDownTimer = null;
  var endNoticeTimer = null;
  var preview = null;      // { bytes:Uint8Array, dataUrl:string, size, width, height }
  var imageBusy = false;
  var activeStream = null;

  var msgsBox = $('msgs');
  var chatEl = $('screen-chat');

  function show(name) {
    ['start', 'wait', 'chat'].forEach(function (s) {
      $('screen-' + s).classList.toggle('hidden', s !== name);
    });
    if (name !== 'chat') closeImageView();
    if (name === 'chat') $('text').focus();
    if (name === 'start') $('pwd-a').focus();
  }

  function scrollMsgs() {
    msgsBox.scrollTop = msgsBox.scrollHeight;
  }

  function sysLine(text) {
    var d = document.createElement('div');
    d.className = 'msg sys';
    d.textContent = text;
    msgsBox.appendChild(d);
    scrollMsgs();
  }

  function tagOf(who) {
    return who === 'self' ? TAG_SELF : TAG_PEER;
  }

  // 文字气泡：小标签「我 / 你」，正文用 textContent 渲染（杜绝注入）
  function bubbleText(text, who) {
    var d = document.createElement('div');
    d.className = 'msg ' + who;
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = tagOf(who);
    var body = document.createElement('span');
    body.className = 'body';
    body.textContent = text;
    d.appendChild(tag);
    d.appendChild(body);
    msgsBox.appendChild(d);
    scrollMsgs();
    return d;
  }

  function removeNode(el) {
    try { if (el && el.parentNode) el.parentNode.removeChild(el); } catch (_) {}
  }

  // 图片气泡：只接受解密后得到的 image/* data URL
  function bubbleImage(dataUrl, who) {
    var d = document.createElement('div');
    d.className = 'msg ' + who + ' pic-msg';
    var tag = document.createElement('span');
    tag.className = 'tag';
    tag.textContent = tagOf(who);
    var body = document.createElement('span');
    body.className = 'body';
    var img = document.createElement('img');
    img.className = 'pic';
    img.alt = '加密图片';
    img.decoding = 'async';
    img.loading = 'lazy';
    img.src = dataUrl;
    img.addEventListener('click', function () { openImageView(dataUrl); });
    body.appendChild(img);
    d.appendChild(tag);
    d.appendChild(body);
    msgsBox.appendChild(d);
    scrollMsgs();
    return d;
  }

  // ---------- 图片放大查看 ----------
  function openImageView(dataUrl) {
    if (!dataUrl || !/^data:image\//i.test(dataUrl)) return;
    $('img-view-img').src = dataUrl;
    $('img-view').classList.remove('hidden');
  }
  function closeImageView() {
    $('img-view').classList.add('hidden');
    $('img-view-img').removeAttribute('src');
  }
  $('img-view').addEventListener('click', function (e) {
    if (e.target && e.target.id === 'img-view-img') return;
    closeImageView();
  });
  $('img-view-close').addEventListener('click', closeImageView);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeImageView();
  });

  // ---------- 会话结束：彻底清理 ----------
  function clearKeys() {
    encKey = null;
    macKey = null;
    pairKey = null;
  }

  function clearEsDownTimer() {
    if (esDownTimer) {
      clearTimeout(esDownTimer);
      esDownTimer = null;
    }
  }

  function stopActiveStream() {
    if (activeStream) {
      try {
        activeStream.getTracks().forEach(function (t) { try { t.stop(); } catch (_) {} });
      } catch (_) {}
      activeStream = null;
    }
  }

  function clearPreview() {
    preview = null;
    var img = $('preview-img');
    if (img) img.removeAttribute('src');
    var meta = $('preview-meta');
    if (meta) meta.textContent = '';
    $('preview').classList.add('hidden');
    try { $('file-input').value = ''; } catch (_) {}
  }

  function wipeMessages() {
    while (msgsBox.firstChild) msgsBox.removeChild(msgsBox.firstChild);
    msgsBox.innerHTML = '';
  }

  // 状态、密钥、DOM、预览、图片引用全部清空，回到开始页
  function resetToStart(notice) {
    state = 'idle';
    roomId = null;
    clearKeys();
    closeEvents();
    stopActiveStream();
    clearPreview();
    closeImageView();
    imageBusy = false;
    wipeMessages();
    $('text').value = '';
    $('pwd-a').value = '';
    $('pwd-b').value = '';
    $('start-err').textContent = '';
    $('btn-start').disabled = false;
    chatEl.classList.remove('dragover');
    cid = rnd();
    show('start');
    if (notice) {
      var n = $('last-end');
      n.textContent = notice;
      clearTimeout(endNoticeTimer);
      endNoticeTimer = setTimeout(function () { n.textContent = ''; }, 20000);
    }
  }

  function finish(reason) {
    if (state === 'idle') return;
    resetToStart('上次聊天已结束（内容未保存）：' + (reason || '正常结束'));
  }

  function goChat(sysText) {
    state = 'chat';
    esDownNotified = false;
    show('chat');
    if (sysText) sysLine(sysText);
  }

  // ---------- 实时事件通道（SSE） ----------
  function openEvents() {
    if (es) return;
    esDownNotified = false;
    clearEsDownTimer();
    es = new EventSource('/events?cid=' + encodeURIComponent(cid));
    es.onmessage = onServerEvent;
    es.onerror = function () {
      if (state === 'chat' && !esDownNotified) {
        esDownNotified = true;
        sysLine('连接中断，正在尝试重连…');
        clearEsDownTimer();
        esDownTimer = setTimeout(function () {
          if (state === 'chat') finish('连接已断开，会话已结束。');
        }, 12000);
      }
    };
  }

  function closeEvents() {
    clearEsDownTimer();
    esDownNotified = false;
    if (es) {
      try { es.close(); } catch (_) {}
      es = null;
    }
  }

  function onServerEvent(e) {
    clearEsDownTimer();
    var m;
    try { m = JSON.parse(e.data); } catch (_) { return; }
    if (!m || typeof m.type !== 'string') return;
    if (m.type === 'connected') {
      esDownNotified = false;
      if (state !== 'chat') goChat('碰头成功。开始聊吧 —— 消息端到端加密，只在内存中转发。');
    } else if (m.type === 'msg') {
      receivePayload(m.payload);
    } else if (m.type === 'end') {
      finish(typeof m.reason === 'string' && m.reason ? m.reason : '对方结束了会话，聊天内容已清除。');
    } else if (m.type === 'bound') {
      if (state === 'chat' && m.roomId !== roomId && esDownNotified) {
        finish('连接已恢复，但会话已失效。');
      } else if (state === 'waiting' && m.roomId !== roomId && esDownNotified) {
        finish('连接已中断，等待已取消。');
      } else {
        esDownNotified = false;
      }
    }
  }

  // ---------- 网络辅助 ----------
  function api(pathname, data) {
    return fetch(pathname, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    }).then(function (r) {
      return r.json().catch(function () { return { ok: false, error: '服务器返回异常。' }; });
    });
  }

  // ---------- 开始 / 配对（A、B 双密码） ----------
  function startChat() {
    if (state !== 'idle') return;
    var pa = $('pwd-a').value;
    var pb = $('pwd-b').value;
    if (pa.length < 4 || pa.length > 128 || pb.length < 4 || pb.length > 128) {
      $('start-err').textContent = 'A、B 两个密码都要填写，长度需在 4 到 128 个字符之间。';
      return;
    }
    if (window.__abbaCryptoLoadError || window.__abbaVendorLoadError ||
        !window.AbbaCrypto || typeof window.AbbaCrypto.deriveKeys !== 'function' ||
        typeof window.AbbaCrypto.encrypt !== 'function') {
      $('start-err').textContent = '加密模块加载失败，请刷新页面重试。';
      return;
    }
    $('start-err').textContent = '';
    $('btn-start').disabled = true;

    var keys = null;
    try { keys = window.AbbaCrypto.deriveKeys(pa, pb); } catch (_) { keys = null; }
    pa = '';
    pb = '';
    $('pwd-a').value = '';
    $('pwd-b').value = '';

    if (!keys || typeof keys.pairKey !== 'string' || !keys.pairKey) {
      $('btn-start').disabled = false;
      $('start-err').textContent = '密钥生成失败，请重试。';
      return;
    }
    encKey = keys.encKey;
    macKey = keys.macKey;
    pairKey = keys.pairKey;

    openEvents();
    // 只把 pairKey 发给服务器；两个密码明文绝不进入任何请求
    api('/api/enter', { cid: cid, pairKey: keys.pairKey }).then(function (d) {
      $('btn-start').disabled = false;
      if (!d || !d.ok) {
        if (state === 'idle') {
          resetToStart('');
          $('start-err').textContent = (d && d.error) || '出错了，请重试。';
        } else {
          sysLine('进入聊天失败：' + ((d && d.error) || '未知错误'));
        }
        return;
      }
      roomId = d.roomId;
      if (d.status === 'waiting' && state !== 'chat') {
        state = 'waiting';
        show('wait');
      } else if (d.status === 'connected' && state !== 'chat') {
        goChat('碰头成功。开始聊吧 —— 消息端到端加密，只在内存中转发。');
      }
    }).catch(function () {
      $('btn-start').disabled = false;
      if (state === 'idle') {
        resetToStart('');
        $('start-err').textContent = '连不上服务器，请确认服务已启动。';
      } else {
        sysLine('进入聊天失败：网络错误。');
      }
    });
  }

  $('btn-start').addEventListener('click', startChat);
  $('pwd-a').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') startChat();
  });
  $('pwd-b').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') startChat();
  });

  // ---------- 复制本页链接 ----------
  $('btn-copy').addEventListener('click', function () {
    var url = location.href;
    var done = function () {
      $('btn-copy').textContent = '已复制 ✓';
      setTimeout(function () { $('btn-copy').textContent = '复制本页链接'; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(function () {
        window.prompt('请手动复制本页地址：', url);
      });
    } else {
      window.prompt('请手动复制本页地址：', url);
    }
  });

  // ---------- 取消等待 ----------
  $('btn-cancel').addEventListener('click', function () {
    var rid = roomId;
    var oldCid = cid;
    api('/api/leave', { cid: oldCid, roomId: rid }).catch(function () {});
    finish('你已取消等待。');
  });

  // ---------- 结束聊天 ----------
  $('btn-leave').addEventListener('click', function () {
    if (state !== 'chat') {
      finish('你结束了会话，聊天内容已清除。');
      return;
    }
    if (!confirm('结束聊天后，内容立刻清空且找不回来。确定结束？')) return;
    var rid = roomId;
    var oldCid = cid;
    api('/api/leave', { cid: oldCid, roomId: rid }).catch(function () {});
    finish('你结束了会话，聊天内容已清除。');
  });

  // ---------- 发文字 ----------
  function sendCurrent() {
    if (state !== 'chat' || !roomId || !encKey || !macKey) return;
    var t = $('text').value.trim();
    if (!t) return;
    if (t.length > MAX_TEXT_LEN) {
      sysLine('消息太长（最多 ' + MAX_TEXT_LEN + ' 个字符）。');
      return;
    }
    var payload;
    try {
      var sealed = window.AbbaCrypto.encrypt({ k: 'text', text: t }, encKey, macKey);
      if (typeof sealed !== 'string' || !sealed) throw new Error('bad sealed payload');
      // encrypt 返回 JSON 字符串；线上 payload 字段是 §1 形状的 JSON 对象（服务器做形状校验）
      payload = JSON.parse(sealed);
    } catch (_) {
      sysLine('发送失败：加密出错。');
      return;
    }
    if (!payload || typeof payload !== 'object' || typeof payload.ct !== 'string' || typeof payload.mac !== 'string') {
      sysLine('发送失败：加密模块返回异常。');
      return;
    }
    if (JSON.stringify(payload).length > MAX_PAYLOAD_LEN) {
      sysLine('消息太大，无法发送。');
      return;
    }
    $('text').value = '';
    var el = bubbleText(t, 'self');
    // 线上只发送密文 payload
    api('/api/send', { cid: cid, roomId: roomId, payload: payload }).then(function (d) {
      if (!d || !d.ok) {
        removeNode(el);
        sysLine('发送失败：' + ((d && d.error) || '未知错误'));
      }
    }).catch(function () {
      removeNode(el);
      sysLine('发送失败：网络错误。');
    });
  }
  $('send-form').addEventListener('submit', function (e) {
    e.preventDefault();
    sendCurrent();
  });
  $('text').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      sendCurrent();
    }
  });

  // ---------- 接收 ----------
  function receivePayload(payload) {
    if (state !== 'chat') return;
    if (!encKey || !macKey) return;
    var obj;
    try {
      var s = typeof payload === 'string' ? payload : JSON.stringify(payload);
      if (!s) throw new Error('empty payload');
      obj = window.AbbaCrypto.decrypt(s, encKey, macKey);
    } catch (_) {
      sysLine('这条消息无法解密');
      return;
    }
    if (!obj || typeof obj !== 'object' || obj.v !== 1) {
      sysLine('这条消息无法解密');
      return;
    }
    if (obj.k === 'text') {
      var t = typeof obj.text === 'string' ? obj.text : '';
      if (!t) { sysLine('收到一条空消息'); return; }
      if (t.length > MAX_TEXT_LEN) t = t.slice(0, MAX_TEXT_LEN) + '…';
      bubbleText(t, 'peer');
    } else if (obj.k === 'image') {
      var dataUrl = imageDataUrl(obj);
      if (!dataUrl) { sysLine('这条消息无法解密'); return; }
      bubbleImage(dataUrl, 'peer');
    } else {
      sysLine('收到不支持的消息类型');
    }
  }

  // 解密后的图片数据 → image/* data URL。
  // AbbaCrypto.decrypt 对 image 返回 { k:'image', v:1, bytes:Uint8Array, dataURL:string }，
  // 这里优先用 dataURL，同时兼容只给出 bytes（/data）的封装版本。
  function imageDataUrl(obj) {
    if (!obj) return '';
    var direct = obj.dataURL || obj.dataUrl;
    if (typeof direct === 'string' && /^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(direct)) {
      return direct;
    }
    var mime = /^image\/(png|jpeg|webp|gif)$/i.test(String(obj.mime || '')) ? String(obj.mime) : 'image/jpeg';
    var raw = null;
    var rawData = obj.bytes != null ? obj.bytes : obj.data;
    if (rawData instanceof Uint8Array) raw = rawData;
    else if (rawData instanceof ArrayBuffer) raw = new Uint8Array(rawData);
    else if (Array.isArray(rawData)) raw = new Uint8Array(rawData);
    if (!raw) {
      if (typeof rawData === 'string') {
        var str = rawData.trim();
        if (/^data:image\//i.test(str)) return str;
        if (/^[A-Za-z0-9+/=]+$/.test(str)) return 'data:' + mime + ';base64,' + str;
      }
      return '';
    }
    if (!raw.length || raw.length > 8 * 1024 * 1024) return '';
    return 'data:' + mime + ';base64,' + bytesToBase64(raw);
  }

  function bytesToBase64(bytes) {
    var chunk = 0x8000;
    var parts = [];
    for (var i = 0; i < bytes.length; i += chunk) {
      parts.push(String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)));
    }
    return btoa(parts.join(''));
  }

  // ---------- 图片压缩（最长边 ≤1600、JPEG q0.82、目标 ≤600KB） ----------
  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return window.createImageBitmap(file).catch(function () {
        return loadImageElement(file);
      });
    }
    return loadImageElement(file);
  }

  function loadImageElement(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      var settle = function (ok, val) {
        try { URL.revokeObjectURL(url); } catch (_) {}
        if (ok) resolve(val); else reject(val);
      };
      img.onload = function () { settle(true, img); };
      img.onerror = function () { settle(false, new Error('图片无法读取')); };
      img.src = url;
    });
  }

  function canvasToBlob(canvas, type, quality) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob); else reject(new Error('图片编码失败'));
        }, type, quality);
        return;
      }
      try {
        var dataUrl = canvas.toDataURL(type, quality);
        var bin = atob(dataUrl.split(',')[1]);
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        resolve(new Blob([bytes], { type: type }));
      } catch (err) {
        reject(err);
      }
    });
  }

  function blobToDataUrl(blob) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onload = function () { resolve(String(fr.result)); };
      fr.onerror = function () { reject(fr.error || new Error('图片读取失败')); };
      fr.readAsDataURL(blob);
    });
  }

  function compressDrawable(source, sw, sh) {
    return Promise.resolve().then(function () {
      if (!sw || !sh || sw <= 0 || sh <= 0) throw new Error('图片尺寸无效');
      var scale = Math.min(1, MAX_IMAGE_EDGE / Math.max(sw, sh));
      var w = Math.max(1, Math.round(sw * scale));
      var h = Math.max(1, Math.round(sh * scale));
      var canvas = document.createElement('canvas');
      var ctx = canvas.getContext('2d');
      if (!ctx) throw new Error('画布不可用');
      var quality = JPEG_QUALITY;
      var attempt = 0;

      function step() {
        if (attempt >= 10) throw new Error('压缩后仍超过 600KB');
        attempt += 1;
        canvas.width = w;
        canvas.height = h;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(source, 0, 0, w, h);
        return canvasToBlob(canvas, 'image/jpeg', quality).then(function (blob) {
          if (blob && blob.size <= MAX_IMAGE_BYTES) {
            return blob.arrayBuffer().then(function (ab) {
              return blobToDataUrl(blob).then(function (dataUrl) {
                return {
                  bytes: new Uint8Array(ab),
                  size: blob.size,
                  width: w,
                  height: h,
                  dataUrl: dataUrl,
                };
              });
            });
          }
          if (quality > 0.5) {
            quality = Math.max(0.5, quality - 0.08);
          } else {
            w = Math.max(1, Math.round(w * 0.78));
            h = Math.max(1, Math.round(h * 0.78));
            quality = 0.72;
          }
          return step();
        });
      }
      return step();
    });
  }

  function formatSize(n) {
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(2) + ' MB';
  }

  function setPreview(asset) {
    clearPreview();
    preview = asset;
    $('preview-img').src = asset.dataUrl;
    $('preview-meta').textContent = asset.width + '×' + asset.height + ' · ' + formatSize(asset.size) +
      ' · 预览中，确认后才会加密发送';
    $('preview').classList.remove('hidden');
    $('btn-preview-send').focus();
  }

  // ---------- 选图 / 粘贴 / 拖拽 ----------
  function addImageFile(file) {
    if (state !== 'chat') return;
    if (!file || !/^image\//i.test(String(file.type || ''))) {
      sysLine('只能发送图片文件。');
      return;
    }
    if (imageBusy) {
      sysLine('正在处理上一张图片，请稍候。');
      return;
    }
    imageBusy = true;
    loadBitmap(file).then(function (source) {
      var sw = source.width || source.naturalWidth || 0;
      var sh = source.height || source.naturalHeight || 0;
      return compressDrawable(source, sw, sh).then(function (asset) {
        if (source && typeof source.close === 'function') {
          try { source.close(); } catch (_) {}
        }
        return asset;
      });
    }).then(function (asset) {
      if (state === 'chat') setPreview(asset);
    }).catch(function () {
      sysLine('图片处理失败，请换一张图片重试。');
    }).then(function () {
      imageBusy = false;
    });
  }

  function firstImageFromDataTransfer(dt) {
    if (!dt) return null;
    var files = dt.files;
    if (files && files.length) {
      for (var i = 0; i < files.length; i++) {
        if (/^image\//i.test(String(files[i].type || ''))) return files[i];
      }
      return files[0];
    }
    var items = dt.items;
    if (items) {
      for (var j = 0; j < items.length; j++) {
        if (items[j].kind === 'file' && /^image\//i.test(String(items[j].type || ''))) {
          return items[j].getAsFile();
        }
      }
    }
    return null;
  }

  $('btn-image').addEventListener('click', function () { $('file-input').click(); });
  $('file-input').addEventListener('change', function () {
    var f = this.files && this.files[0];
    try { this.value = ''; } catch (_) {}
    if (f) addImageFile(f);
  });

  document.addEventListener('paste', function (e) {
    if (state !== 'chat' || !e.clipboardData) return;
    var f = firstImageFromDataTransfer(e.clipboardData);
    if (f) {
      e.preventDefault();
      addImageFile(f);
    }
  });

  ['dragenter', 'dragover'].forEach(function (ev) {
    chatEl.addEventListener(ev, function (e) {
      if (state !== 'chat') return;
      e.preventDefault();
      if (e.dataTransfer) { try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {} }
      chatEl.classList.add('dragover');
    });
  });
  ['dragleave', 'dragend'].forEach(function (ev) {
    chatEl.addEventListener(ev, function () { chatEl.classList.remove('dragover'); });
  });
  chatEl.addEventListener('drop', function (e) {
    if (state !== 'chat') return;
    e.preventDefault();
    chatEl.classList.remove('dragover');
    var f = firstImageFromDataTransfer(e.dataTransfer);
    if (f) addImageFile(f);
    else sysLine('没有识别到图片，请拖入图片文件（JPG/PNG 等）。');
  });
  document.addEventListener('dragover', function (e) { if (state === 'chat') e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (state === 'chat') e.preventDefault(); });

  // ---------- 发送预览中的图片（加密后发送） ----------
  // 图片明文形状与 AbbaCrypto 的约定一致：k:'image'，bytes 为压缩后的 JPEG 字节（Uint8Array）
  function makeImagePlain(bytes) {
    return { k: 'image', bytes: bytes };
  }

  function sendPayload(payload) {
    return api('/api/send', { cid: cid, roomId: roomId, payload: payload });
  }

  $('btn-preview-send').addEventListener('click', function () {
    if (state !== 'chat' || !roomId || !encKey || !macKey || !preview) return;
    var asset = preview;
    var payload;
    try {
      var sealed = window.AbbaCrypto.encrypt(makeImagePlain(asset.bytes), encKey, macKey);
      if (typeof sealed !== 'string' || !sealed) throw new Error('bad sealed payload');
      // 线上 payload 字段是 JSON 对象；图片密文 ct 就是压缩后 JPEG 字节的密文
      payload = JSON.parse(sealed);
    } catch (_) {
      sysLine('发送失败：加密出错。');
      return;
    }
    if (!payload || typeof payload !== 'object' || typeof payload.ct !== 'string' || typeof payload.mac !== 'string') {
      sysLine('发送失败：加密模块返回异常。');
      return;
    }
    if (JSON.stringify(payload).length > MAX_PAYLOAD_LEN) {
      sysLine('图片太大，无法发送。');
      return;
    }
    var dataUrl = asset.dataUrl;
    clearPreview();
    var el = bubbleImage(dataUrl, 'self');
    sendPayload(payload).then(function (d) {
      if (!d || !d.ok) {
        removeNode(el);
        sysLine('发送失败：' + ((d && d.error) || '未知错误'));
      }
    }).catch(function () {
      removeNode(el);
      sysLine('发送失败：网络错误。');
    });
  });

  $('btn-preview-cancel').addEventListener('click', function () {
    clearPreview();
    $('text').focus();
  });

  // ---------- 截屏 ----------
  function delay(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  function waitVideoReady(video) {
    return new Promise(function (resolve, reject) {
      var settled = false;
      var timer = setTimeout(function () { settle(false, new Error('等待屏幕画面超时')); }, 10000);
      function settle(ok, err) {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        if (ok) resolve(); else reject(err);
      }
      function start() {
        if (settled) return;
        var p;
        try { p = video.play(); } catch (err) { settle(false, err); return; }
        if (p && typeof p.then === 'function') {
          p.then(function () { settle(true); }).catch(function (err) { settle(false, err); });
        } else {
          settle(true);
        }
      }
      video.onloadedmetadata = start;
      video.onerror = function () { settle(false, new Error('无法读取屏幕画面')); };
      if (video.readyState >= 1) start();
    });
  }

  function takeScreenshot() {
    if (state !== 'chat') return;
    if (imageBusy) {
      sysLine('正在处理图片，请稍候。');
      return;
    }
    if (!navigator.mediaDevices || typeof navigator.mediaDevices.getDisplayMedia !== 'function') {
      sysLine('当前环境不支持截屏；可以手动截图后粘贴或拖入图片。');
      return;
    }
    imageBusy = true;
    var stream = null;
    // 某些环境（无头浏览器 / 没有屏幕选择器的壳）里 getDisplayMedia 可能一直不返回；
    // 超时后给友好提示并解除忙碌状态，避免页面看起来“卡住”。迟到的画面仍会被接收。
    var captureTimer = setTimeout(function () {
      if (state === 'chat' && imageBusy) {
        imageBusy = false;
        sysLine('没有收到屏幕画面（可能取消了屏幕选择）；如果页面在 DSH 右侧栏里，请点工具条「在浏览器打开」后再试。');
      }
    }, 15000);
    Promise.resolve().then(function () {
      return navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    }).then(function (s) {
      stream = s;
      activeStream = s;
      var video = document.createElement('video');
      video.muted = true;
      video.playsInline = true;
      video.setAttribute('playsinline', '');
      video.srcObject = s;
      return waitVideoReady(video).then(function () {
        return delay(80);
      }).then(function () {
        var sw = video.videoWidth || 0;
        var sh = video.videoHeight || 0;
        if (!sw || !sh) throw new Error('没有抓到画面');
        return compressDrawable(video, sw, sh);
      });
    }).then(function (asset) {
      stopActiveStream();
      if (state === 'chat') setPreview(asset);
    }).catch(function (err) {
      stopActiveStream();
      var name = (err && err.name) || '';
      if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'AbortError' ||
          name === 'PermissionDeniedError' || name === 'NotReadableError') {
        sysLine('截屏权限被拒绝或已取消；如果页面在 DSH 右侧栏里，请点工具条「在浏览器打开」后再试。');
      } else {
        sysLine('截屏失败：' + ((err && err.message) || '未知错误'));
      }
    }).then(function () {
      clearTimeout(captureTimer);
      if (stream) {
        try { stream.getTracks().forEach(function (t) { try { t.stop(); } catch (_) {} }); } catch (_) {}
        stream = null;
      }
      if (activeStream === stream) activeStream = null;
      imageBusy = false;
    });
  }

  $('btn-shot').addEventListener('click', takeScreenshot);

  // 页面加载完成：停在开始页，此时没有任何密钥与会话
  show('start');
})();
</script>
</body>
</html>
